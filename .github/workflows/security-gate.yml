name: IronWall Security Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  security-gate:
    name: Release gate (GAP=0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Java regression
        run: mvn -B test

      - name: Aggregate surefire (GAP=0)
        shell: bash
        run: |
          TESTS=0; FAILURES=0; ERRORS=0
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            line=$(grep -E '^Tests run:' "$f" | tail -n1)
            t=$(echo "$line" | awk -F'[,:]' '{print $2}')
            fai=$(echo "$line" | awk -F'[,:]' '{print $4}')
            err=$(echo "$line" | awk -F'[,:]' '{print $6}')
            TESTS=$((TESTS + ${t:-0})); FAILURES=$((FAILURES + ${fai:-0})); ERRORS=$((ERRORS + ${err:-0}))
          done
          GAP=$((FAILURES + ERRORS))
          echo "[GATE] tests=$TESTS failures=$FAILURES errors=$ERRORS"
          if [ "$TESTS" -eq 0 ] || [ "$GAP" -gt 0 ]; then
            echo "[GATE] FAIL: GAP=$GAP"
            exit 1
          fi
          echo "[GATE] PASS: GAP=0"

      - name: Python regression (optional, server-maintained)
        shell: bash
        run: |
          if [ -f security-tests/ironwall_regression_test.py ]; then
            python3 security-tests/ironwall_regression_test.py
          else
            echo "[GATE] INFO: ironwall_regression_test.py not synced, java gate only"
          fi

  supply-chain:
    name: Supply-chain scan (best effort)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend dependency-check (report only)
        continue-on-error: true
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            || echo "[SUPPLY] INFO: backend dependency-check unavailable (plugin/network); not blocking"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend npm audit (report only)
        continue-on-error: true
        working-directory: frontend
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high \
              || echo "[SUPPLY] INFO: npm audit findings or network unavailable; not blocking"
          else
            echo "[SUPPLY] INFO: package.json not present, npm audit skipped"
          fi
