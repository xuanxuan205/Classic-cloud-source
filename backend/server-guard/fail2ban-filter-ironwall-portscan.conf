# IronWall v1.26.0 - 端口扫描检测过滤器
# 安装位置：/etc/fail2ban/filter.d/ironwall-portscan.conf
# 匹配日志：/www/wwwroot/jdy-cloud/logs/ironwall-portscan.log
# 样例行：
# 2026-08-19T22:00:00+0800 IRONWALL-PORTSCAN ip=203.0.113.9 ports=4 action=BAN

[Definition]
failregex = ^\S+\s+IRONWALL-PORTSCAN ip=<HOST> ports=\d+ action=BAN$
            ^\S+\s+IRONWALL-PORTSCAN ip=<IP6> ports=\d+ action=BAN$
ignoreregex =