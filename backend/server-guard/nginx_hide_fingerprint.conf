# ============================================================
# IronWall v1.26.0 - Nginx 服务指纹收敛
# 把这些粘贴进 example.com 的 server{} 顶部，然后 nginx -t && nginx -s reload
# ============================================================
server_tokens off;

# 隐藏上游默认错误页/框架指纹（若使用反代 PHP/JAVA）
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
fastcgi_hide_header X-Powered-By;

# 拒绝直接访问前端源码目录与 sourcemap
location ~* \.(map|ts|vue)$ {
    return 404;
}