# IronWall v1.23.0 网站层 -> 服务器层 联动桥（fail2ban 监狱）
# 安装位置：/etc/fail2ban/jail.d/ironwall.conf
# 效果：IronWall 封禁某 IP 的瞬间，fail2ban 在操作系统层对该 IP 执行
# 全端口封禁（iptables/nftables），并把网站封禁升级为服务器封禁。

[ironwall]
# 管理员白名单：防止自己触发封禁后连 SSH/面板都进不去（如 IP 变化请修改）
ignoreip  = 127.0.0.1/8 ::1 203.0.113.10 203.0.113.11
enabled   = true
port      = all
filter    = ironwall
logpath   = /www/wwwroot/jdy-cloud/logs/ironwall-attacks.log
maxretry  = 1
findtime  = 600
bantime   = 1800
# 再犯递增封禁时长：30min -> 1h -> 2h -> ... -> 最大 7 天
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 604800
# 全端口封禁（含 SSH / 面板 / 数据库端口，仅放行已建立的连接与本机回环）
banaction = iptables-allports
action    = %(action_)s