# IronWall v1.23.0 网站层 -> 服务器层 联动桥（fail2ban 过滤器）
# 安装位置：/etc/fail2ban/filter.d/ironwall.conf
# 匹配日志：/www/wwwroot/jdy-cloud/logs/ironwall-attacks.log
# 样例行：
# 2026-08-18T21:00:00.123+08:00 IRONWALL-BLOCK ip=203.0.113.9 category=SQL注入 score=25 action=BLOCKED
# （IPv6 示例：ip=2409:895a:50bf:a1e1::1）

[Definition]
failregex = ^\S+\s+IRONWALL-BLOCK ip=<HOST> category=\S+ score=\d+ action=BLOCKED$
            ^\S+\s+IRONWALL-BLOCK ip=<IP6> category=\S+ score=\d+ action=BLOCKED$
ignoreregex =

[Init]
# 无需 journalmatch：IronWall 直接写独立文本日志