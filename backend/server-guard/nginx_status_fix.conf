# ============================================================
# IronWall v1.26.0: 封堵 nginx_status 公网泄露
# 请把下面整段粘贴进「默认站点 / default_server」或任何监听 80
# 的 server 块中，然后执行：nginx -t && nginx -s reload
# ============================================================
location = /nginx_status {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    stub_status;
}

# 同类型运维状态端点一并收紧（若模块不存在，nginx -t 会报错，可删除该段）
location = /server-status {
    allow 127.0.0.1;
    allow ::1;
    deny all;
}