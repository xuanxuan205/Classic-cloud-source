# IronWall v1.38.0: JA4 形会话指纹边缘接入（nginx njs）
# ------------------------------------------------------------------
# 1) http 段（/www/server/nginx/conf/nginx.conf 的 http { ... } 内，紧邻 mime.types 行之后）：
# load_module modules/ngx_http_js_module.so; # 若 nginx -V 显示 --add-dynamic-module 则必填，内置编译则删掉本行
# js_import ironwall_ja4 from /www/server/nginx/conf/ja4.js;
#
# 2) server 段（网站配置 example.com.conf 的 server { ... } 内）：
# js_set $ironwall_ja4 ironwall_ja4.ja4;
#
# 3) /api/ 反代段（proxy/example.com/*.conf 的 location /api/ { ... } 内）：
# proxy_set_header X-TLS-JA4 $ironwall_ja4;
#
# 以下为本文件可直接 include 的片段（仅含 server 段生效语句，http 段语句需按上面第 1 步手工加）：

js_set $ironwall_ja4 ironwall_ja4.ja4;

# 供复制进 /api/ 反代段使用（不要在本文件重复 proxy_set_header 给非反代 location）
# proxy_set_header X-TLS-JA4 $ironwall_ja4;
