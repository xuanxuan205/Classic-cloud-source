# IronWall v1.47.7: http{} 段限流 zone 定义
# 粘贴到 /www/server/nginx/conf/nginx.conf 的 http { ... } 内（紧邻 mime.types 之后）。
# example.com 的 server{} 与 /api/ 反代段引用了以下 zone，缺此段 nginx -t 会报 zone 未定义。

limit_conn_zone $binary_remote_addr zone=ironwall_conn:10m;
limit_req_zone $binary_remote_addr zone=ironwall_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ironwall_static:10m rate=50r/s;
