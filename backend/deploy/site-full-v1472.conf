server
{
listen 80;
listen 443 ssl;
listen 443 quic;
http2 on;
http3 on;
server_name example.com www.example.com;
index index.php index.html index.htm default.php default.htm default.html;
root /www/wwwroot/example.com;

# IronWall v1.26.0 源码/指纹收敛
server_tokens off;
proxy_hide_header Server;
proxy_hide_header X-Powered-By;
fastcgi_hide_header X-Powered-By;

# IronWall v1.35.0 / 超时收紧 + 连接层限流（依赖主配置 ironwall_conn zone）
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 15s;
send_timeout 10s;
limit_conn ironwall_conn 30;
limit_conn_status 429;
limit_req_status 429;
error_page 429 =429 /rate-error.json;

location ~* \.(map|ts|vue)$ {
return 404;
}

# IronWall v1.28.7 维护护盾：后端重启期间统一展示维护页
set $ironwall_maint "";
if ($uri != "/maintenance.html") { set $ironwall_maint "1"; }
if (-f /www/wwwroot/jdy-cloud/logs/maintenance.flag) { set $ironwall_maint "${ironwall_maint}1"; }
if ($ironwall_maint = "11") { return 503; }
error_page 503 = /maintenance.html;
location = /maintenance.html { try_files /maintenance.html =404; }

# IronWall v1.28.13：协议层/网关层错误统一最小 JSON（防 nginx 默认页签名泄露）
# 注意：503 不在列表内，不影响维护护盾；404 不在此处，不影响 /404.html
error_page 400 405 413 414 =400 /api-error.json;
error_page 500 502 504 =500 /api-error.json;
location = /api-error.json {
internal;
default_type application/json;
add_header Content-Type "application/json; charset=utf-8" always;
add_header X-Content-Type-Options nosniff always;
return 200 '{"code":400,"message":"请求不合法","path":"/api"}';
}

# IronWall v1.35.0 / 限流 429 统一 JSON 页面
location = /rate-error.json {
internal;
default_type application/json;
add_header Content-Type "application/json; charset=utf-8" always;
add_header X-Content-Type-Options nosniff always;
return 429 '{"code":429,"message":"请求过于频繁，请稍后再试"}';
}

# 只有本域名能访问，直接访问服务器 IP 或陌生域名一律断开
if ($host !~* "^(example\.com|www\.example\.com)$") { return 444; }

#CERT-APPLY-CHECK--START
# 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
include /www/server/panel/vhost/nginx/well-known/example.com.conf;
#CERT-APPLY-CHECK--END
include /www/server/panel/vhost/nginx/extension/example.com/*.conf;

#SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
#error_page 404/404.html;
#HTTP_TO_HTTPS_START
set $isRedcert 1;
if ($server_port != 443) {
    set $isRedcert 2;
}
if ( $uri ~ /\.well-known/ ) {
    set $isRedcert 1;
}
if ($isRedcert != 1) {
    rewrite ^(/.*)$ https://$host$1 permanent;
}
#HTTP_TO_HTTPS_END
ssl_certificate    /www/server/panel/vhost/cert/example.com/fullchain.pem;
ssl_certificate_key    /www/server/panel/vhost/cert/example.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers on;
ssl_session_tickets on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443"; h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
quic_retry on;
quic_gso on;
ssl_early_data off;
error_page 497  https://$host$request_uri;
#SSL-END

#ERROR-PAGE-START 错误页配置，可以注释、删除或修改
error_page 404 /404.html;
#error_page 502 /502.html;
#ERROR-PAGE-END

#PHP-INFO-START PHP引用配置，可以注释或修改
#清理缓存规则
location ~ /purge(/.*) {
    allow 127.0.0.1;
    deny all;
    proxy_cache_purge cache_one $host$1$is_args$args;
    #access_log /www/wwwlogs/example.com_purge_cache.log;
}
#引用反向代理规则，注释后配置的反向代理将无效
include /www/server/panel/vhost/nginx/proxy/example.com/*.conf;

include enable-php-82.conf;
#PHP-INFO-END

#REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
include /www/server/panel/vhost/rewrite/example.com.conf;
#REWRITE-END

# IronWall v1.47.2: sensitive paths explicit 404/410 (report item)
# Paste INSIDE the example.com server{} block, before the SPA fallback "location /".
# Exact/prefix/regex locations win over try_files fallback; SPA routes (/login /dashboard /share ...) untouched.
# /api/* is NOT listed here on purpose: the backend engine keeps owning it.

# --- dotfiles / vcs / env / config leaks ---
location ~* ^/\.(git|svn|hg|env|aws|ssh|dockerenv)(/|$) { return 410; }
location = /.gitignore { return 404; }
location = /.htaccess { return 404; }
location = /.DS_Store { return 404; }
location = /id_rsa { return 404; }
location = /id_rsa.pub { return 404; }

# --- Java actuator / management / spring internals ---
location = /actuator { return 404; }
location ^~ /actuator/ { return 404; }
location = /health { return 404; }
location = /metrics { return 404; }
location = /info { return 404; }
location = /trace { return 404; }
location = /heapdump { return 404; }
location = /threaddump { return 404; }
location = /jolokia { return 404; }
location ^~ /jolokia/ { return 404; }
location = /error { return 404; }

# --- swagger / api docs ---
location = /swagger-ui { return 404; }
location ^~ /swagger-ui/ { return 404; }
location = /swagger-ui.html { return 404; }
location = /v2/api-docs { return 404; }
location = /v3/api-docs { return 404; }
location ^~ /api-docs/ { return 404; }

# --- java web containers ---
location = /WEB-INF { return 404; }
location ^~ /WEB-INF/ { return 404; }
location = /META-INF { return 404; }
location ^~ /META-INF/ { return 404; }

# --- admin panels / php leftovers ---
location = /phpmyadmin { return 404; }
location ^~ /phpmyadmin/ { return 404; }
location = /pma { return 404; }
location = /adminer.php { return 404; }
location = /phpinfo.php { return 404; }
location = /console { return 404; }
location = /manager { return 404; }
location ^~ /manager/ { return 404; }

# --- backup / database dumps ---
location ~* ^/(backup|db|dump|database|www|web|site)\.(zip|sql|tar|tar\.gz|gz|7z|rar)$ { return 410; }

# --- server status / monitoring leaks ---
location = /server-status { return 404; }
location = /nginx_status { return 404; }
location = /stub_status { return 404; }

# --- security research bait ---
location = /.well-known/security.txt { return 404; }

# Vue Router history 模式：让 /login、/dashboard 等前端路由回退到入口文件。
# /api/ 的代理规则由上方 proxy/example.com/*.conf 引入，优先匹配，不会被此规则处理。
location / {
    try_files $uri $uri/ /index.html;
    limit_req zone=ironwall_static burst=100 nodelay;
}

# 禁止访问的敏感文件
location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradle|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
{
    return 404;
}

# 禁止访问的敏感目录
location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
    return 404;
}

#一键申请SSL证书验证目录相关设置
location ~ ^/.well-known/ {
    allow all;
}

#禁止在证书验证目录放入敏感文件
if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
    return 403;
}

access_log  /www/wwwlogs/example.com.log;
error_log  /www/wwwlogs/example.com.error.log;
}