# IronWall v1.47.9: HTML 页面安全响应头补全
# 粘贴到 example.com 的 server{} 内。add_header 同名指令后者覆盖前者：
# 请把本段放在现有 HSTS add_header 之后、location 块之外（server 级，location 未重定义时继承）。
# 与 /api/ 反代段已有响应头不冲突（api 段自带 CSP/frame-ancestors/permissions-policy 等更全头部）。

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# CSP 说明：index.html 已内置 <meta http-equiv="Content-Security-Policy">（default-src 'none'; script-src 'self';
# style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self';
# base-uri 'self'; form-action 'self'），浏览器已按 meta 生效。SPA 无内联脚本，如需服务端头全站强制可取消注释：
# add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;