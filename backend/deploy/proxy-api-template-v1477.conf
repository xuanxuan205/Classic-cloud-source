# IronWall v1.47.7: /api/ 反向代理模板
# 替换 /www/server/panel/vhost/nginx/proxy/example.com/*.conf 中对应 location（保留面板管理字段）。
# 前提：http{} 已加载 nginx-http-zones-v1477.conf 与 JA4 模块（X-TLS-JA4 头由站点层注入）。

location ^~ /api/ {
    limit_req zone=ironwall_api burst=40 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:15060;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-TLS-JA4 $http_ssl_ja4;
    proxy_set_header Connection "";

    client_max_body_size 900m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering off;
}
