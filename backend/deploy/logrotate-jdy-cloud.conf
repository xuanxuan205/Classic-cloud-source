# ============================================================
# 经典云 Classic Cloud - 日志轮转配置 (IronWall v1.28.0)
# 安装：复制到服务器 /etc/logrotate.d/jdy-cloud
# 校验：logrotate -d /etc/logrotate.d/jdy-cloud
# 说明：应用日志与站点 nginx 日志每日轮转，保留 14 天并压缩，
# 使用 copytruncate 避免重启应用即可安全截断日志文件。
# ============================================================

/www/wwwroot/jdy-cloud/logs/*.log {
    daily
    rotate 14
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
    su www www
    create 0640 www www
}

/www/wwwlogs/example.com.log
/www/wwwlogs/example.com.error.log
/www/wwwlogs/nginx_error.log {
    daily
    rotate 14
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
    su root root
    create 0640 root root
}